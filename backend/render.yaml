services:
  - type: web
    name: compliance-monitor-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health

databases:
  - name: compliance-db
    plan: free
    databaseName: compliance_db
    user: compliance
